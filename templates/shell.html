<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 模型 · 3D Model</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Microsoft YaHei",system-ui,sans-serif;background:#0d1420;}
  #app{position:fixed;inset:0;}
  #ui{position:fixed;top:18px;left:22px;color:#fff;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.55);}
  #ui h1{margin:0;font-size:30px;letter-spacing:10px;font-weight:600;}
  #ui .sub{margin-top:4px;font-size:10px;letter-spacing:4px;opacity:.75;}
  #bar{position:fixed;top:20px;right:22px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw;}
  .btn{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.35);color:#fff;background:rgba(10,18,30,.45);backdrop-filter:blur(6px);padding:7px 14px;border-radius:20px;font-size:13px;letter-spacing:1px;transition:.2s;}
  .btn:hover{background:rgba(255,255,255,.22);}
  .btn.on{background:#c8a85a;border-color:#c8a85a;color:#1a1a1a;}
  #label{position:fixed;left:24px;bottom:22px;color:#fff;font-size:13px;letter-spacing:2px;opacity:.85;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  #hint{position:fixed;right:24px;bottom:22px;color:#fff;font-size:11px;opacity:.55;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d1420;color:#c8a85a;font-size:15px;letter-spacing:6px;z-index:10;}
  #editbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:none;gap:10px;align-items:center;background:rgba(10,18,30,.8);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);border-radius:26px;padding:10px 16px;color:#fff;font-size:13px;z-index:5;flex-wrap:wrap;justify-content:center;max-width:92vw;}
  .egrp{display:flex;gap:6px;align-items:center;}
  .egrp span{opacity:.7;margin-right:2px;}
  .eb{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.35);color:#fff;background:rgba(255,255,255,.12);padding:5px 11px;border-radius:16px;font-size:12px;transition:.15s;}
  .eb:hover{background:rgba(255,255,255,.3);}
  .eb.danger{background:rgba(200,60,60,.5);border-color:rgba(255,120,120,.6);}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">正在生成模型 …</div>
<div id="ui"><h1 id="modelTitle">3D 模型</h1><div class="sub" id="modelSub">PROCEDURAL 3D MODEL · THREE.JS</div></div>
<div id="bar">
  <button class="btn on" data-view="ext">外观</button>
  <button class="btn" data-view="f1">一层</button>
  <button class="btn" data-view="f2">二层</button>
  <button class="btn" data-view="f3">三层</button>
  <button class="btn" data-view="f4">四层</button>
  <button class="btn" id="nightBtn">☾ 夜晚</button>
  <button class="btn" id="rotBtn">自动旋转</button>
  <button class="btn" id="editBtn">✎ 编辑</button>
  <button class="btn" id="exportBtn">导出 GLB</button>
</div>
<div id="editbar">
  <div class="egrp"><span>添加:</span>
    <button class="eb" data-add="tree">树</button>
    <button class="eb" data-add="bush">灌木</button>
    <button class="eb" data-add="flower">花</button>
    <button class="eb" data-add="rock">石头</button>
    <button class="eb" data-add="bench">长椅</button>
    <button class="eb" data-add="lamp">路灯</button>
    <button class="eb" data-add="car">汽车</button>
    <button class="eb" data-add="pavilion">亭子</button>
    <button class="eb" data-add="fountain">喷泉</button>
  </div>
  <div class="egrp" id="seltools" style="display:none"><span>选中:</span>
    <button class="eb" id="rotL">↺ 左转</button>
    <button class="eb" id="rotR">右转 ↻</button>
    <button class="eb" id="scUp">放大</button>
    <button class="eb" id="scDn">缩小</button>
    <button class="eb danger" id="del">删除</button>
  </div>
</div>
<div id="label">外观环视</div>
<div id="hint">左键旋转 · 滚轮缩放 · 右键平移</div>
<script>
